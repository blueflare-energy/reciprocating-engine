name: bench

# Throughput on real Gaudi2 hardware, recorded on every merge to main. Runs on
# a self-hosted runner labelled `gaudi2`; the runner's environment provides
# RENG_MODEL_DIRS (Hugging Face model directories, colon separated) and
# RENG_MODULE_ID (the module id of the card to use, from `hl-smi`) and
# optionally RENG_ORACLE_DIR (HF reference generations), so nothing
# machine-specific lives in this file. Fork pull requests never reach this job: it only runs on pushes
# to main and manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  workflow_dispatch:
    inputs:
      multi_card:
        description: 'Also run the multi-card sweep (holds all eight cards)'
        type: boolean
        default: false

permissions:
  contents: read

# One benchmark at a time on the card.
concurrency:
  group: bench-gaudi2
  cancel-in-progress: false

jobs:
  bench:
    name: gaudi2 throughput
    runs-on: [self-hosted, gaudi2]
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # A cancelled job can leave its engine process holding the card.
      - name: clean up
        run: |
          for pid in $(pgrep -u "$(id -u)" -f "[t]arget/release/reng-"); do
            echo "killing leftover engine process $pid"
            kill -9 "$pid" || true
          done
          sleep 2
      - name: build
        run: |
          cargo build --release --locked -p reng-model --features link-synapse --bin reng-bench --bin reng-generate
          cargo build --release --locked -p reng-synapse --features link-synapse --bin reng-cache-test --bin reng-batch-test
      # Correctness on the card before any number is recorded: the
      # synthetic cache and batch tests against their CPU references, and
      # teacher-forced generation against the HF references the runner
      # keeps in RENG_ORACLE_DIR (gen8_<model>.json next to the model's
      # prompt ids in prompts.txt; skipped when the directory is unset).
      - name: check
        run: |
          set -euo pipefail
          ./target/release/reng-cache-test
          ./target/release/reng-cache-test 64 256 512 4 512 2 2 512 3 16 1
          ./target/release/reng-batch-test 256 576 1536 9 512 4 3 512 6 3
          RENG_MIN_CAP=64 ./target/release/reng-batch-test 256 256 512 4 512 2 2 512 6 3
          # The reference prompts are spread round-robin over the cards in
          # RENG_CHECK_MODULES (colon-separated module ids; default: the
          # runner's own RENG_MODULE_ID) and checked concurrently, one
          # process per card at a time.
          if [ -n "${RENG_ORACLE_DIR:-}" ] && [ -f "$RENG_ORACLE_DIR/prompts.txt" ]; then
            IFS=: read -ra mods <<< "${RENG_CHECK_MODULES:-${RENG_MODULE_ID:?}}"
            n=${#mods[@]}
            for g in $(seq 0 $((n - 1))); do
              (
                i=0
                while read -r model ref ids; do
                  [ -z "$model" ] && continue
                  if [ $((i % n)) -eq "$g" ]; then
                    out=$(RENG_MODULE_ID=${mods[$g]} ./target/release/reng-generate "$model" "check-$g.json" 8 --ref "$RENG_ORACLE_DIR/$ref" $ids 2>&1) || { echo "$out"; echo "== $model FAILED on module ${mods[$g]}"; exit 1; }
                    echo "== $model (module ${mods[$g]}): $(echo "$out" | grep -E 'vs reference' | head -1)"
                  fi
                  i=$((i + 1))
                done < "$RENG_ORACLE_DIR/prompts.txt"
              ) > "check-group-$g.log" 2>&1 &
            done
            fail=0
            for job in $(jobs -p); do wait "$job" || fail=1; done
            cat check-group-*.log
            [ "$fail" -eq 0 ]
          fi
      - name: run
        run: |
          set -euo pipefail
          : "${RENG_MODEL_DIRS:?the runner must export RENG_MODEL_DIRS}"
          rm -f bench.json
          IFS=: read -ra dirs <<< "$RENG_MODEL_DIRS"
          for dir in "${dirs[@]}"; do
            name=$(basename "$dir")
            ./target/release/reng-bench "$dir" "bench-$name-b1.json" --prompt 128 --new 64
            ./target/release/reng-bench "$dir" "bench-$name-b8.json" --prompt 128 --new 32 --batch 8 --warmup 1
          done
          python3 -c '
          import json, sys
          out = []
          for f in sys.argv[1:]:
              out.extend(json.load(open(f)))
          json.dump(out, open("bench.json", "w"), indent=2)
          ' bench-*.json
          cat bench.json
      - name: sweep
        # Chart 2 (decode per model and batch) and Chart 1 (prefill per model
        # and prompt length), published next to the history under
        # dev/sweep/ on gh-pages.
        # RENG_SWEEP_DIRS (a subset of RENG_MODEL_DIRS) keeps the batch-64
        # and long-context sweeps to the models charted on Pages; the run
        # step above still benches every model.
        run: |
          set -euo pipefail
          IFS=: read -ra dirs <<< "${RENG_SWEEP_DIRS:-$RENG_MODEL_DIRS}"
          python3 tools/sweep.py ./target/release/reng-bench sweep --batches 1,8,64 --new 32 "${dirs[@]}"
          python3 tools/sweep.py ./target/release/reng-bench prefill --mode prefill --contexts 128,512,1024,2048 "${dirs[@]}"
          git fetch --depth=1 origin gh-pages
          rm -rf /tmp/gh-pages && git worktree add /tmp/gh-pages origin/gh-pages
          mkdir -p /tmp/gh-pages/dev/sweep
          cp sweep.md /tmp/gh-pages/dev/sweep/latest.md
          cp sweep.json /tmp/gh-pages/dev/sweep/latest.json
          cp prefill.md /tmp/gh-pages/dev/sweep/prefill.md
          cp prefill.json /tmp/gh-pages/dev/sweep/prefill.json
          cd /tmp/gh-pages
          git config user.name 'blueflare-ci'
          git config user.email 'ci@blueflare.energy'
          git add dev/sweep
          if ! git diff --cached --quiet; then
            git commit -q -m "bench: decode sweep for ${GITHUB_SHA::7}"
            git push -q origin HEAD:gh-pages
          fi
          cd - >/dev/null && git worktree remove --force /tmp/gh-pages
      - name: record
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Gaudi2 inference
          tool: customBiggerIsBetter
          output-file-path: bench.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          summary-always: true
          # A drop below two thirds of the previous value is flagged in the
          # job summary; nothing fails, the chart is the record.
          alert-threshold: '150%'
          comment-on-alert: false
          fail-on-alert: false

  # The multi-card sweep is never part of the automatic path: it holds every
  # card named in RENG_MULTI_MODULES (all eight by default) for as long as it
  # runs, which would stall every other job on the runner. Start it by hand
  # from the Actions tab with `multi_card` ticked, or run the same command on
  # the box:
  #
  #   python3 tools/sweep_tp.py ./target/release/reng-tp \
  #     ./target/release/reng-bench sweep-mc \
  #     --modules 0,1,2,3,4,5,6,7 --worlds 2,4,8 --replicas 1,8 --batches 1,8 \
  #     --ceiling ./target/release/reng-ceiling --ctx 192 "${dirs[@]}"
  #
  # It runs after `bench` so the two never hold the cards at once.
  multi-card:
    name: multi-card sweep (manual)
    needs: bench
    if: github.event_name == 'workflow_dispatch' && inputs.multi_card
    runs-on: [self-hosted, gaudi2]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: clean up
        run: |
          for pid in $(pgrep -u "$(id -u)" -f "[t]arget/release/reng-"); do
            echo "killing leftover engine process $pid"
            kill -9 "$pid" || true
          done
          sleep 2
      - name: build
        run: |
          cargo build --release --locked -p reng-model --features link-synapse --bin reng-bench --bin reng-tp
          cargo build --release --locked -p reng-ceiling --bin reng-ceiling
      - name: sweep
        run: |
          set -euo pipefail
          : "${RENG_MODEL_DIRS:?the runner must export RENG_MODEL_DIRS}"
          IFS=: read -ra dirs <<< "${RENG_SWEEP_DIRS:-$RENG_MODEL_DIRS}"
          python3 tools/sweep_tp.py ./target/release/reng-tp \
            ./target/release/reng-bench sweep-mc \
            --modules "${RENG_MULTI_MODULES:-0,1,2,3,4,5,6,7}" \
            --worlds 2,4,8 --replicas 1,8 --batches 1,8 \
            --ceiling ./target/release/reng-ceiling --ctx 192 "${dirs[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: multi-card-sweep
          path: |
            sweep-mc.json
            sweep-mc.md
            sweep-mc-cells.json
